
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10152b">
<title>DAHO CENTRE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1020;--panel:#151d35;--panel2:#1c2745;--blue:#5685ff;--purple:#9467ff;--text:#f5f7ff;--muted:#a4afca;--green:#43d6a0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;padding:18px 16px 100px}
.hidden{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.logo{font-size:22px;font-weight:900;letter-spacing:1px}
.logo span{color:#8b9dff}
.avatar{width:43px;height:43px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--purple));display:grid;place-items:center;font-weight:900;font-size:18px}
.hello{color:var(--muted);font-size:14px;margin-bottom:5px}
h1{font-size:27px;line-height:1.2;margin-bottom:8px}
.sub{color:var(--muted);font-size:14px;line-height:1.5}
.hero{background:linear-gradient(130deg,#263f8b,#633cb1);padding:22px;border-radius:24px;margin:20px 0;position:relative;overflow:hidden}
.hero:after{content:"✦";position:absolute;right:20px;top:5px;font-size:95px;color:#ffffff20}
.hero small{color:#d9e2ff}
.hero h2{font-size:23px;margin:8px 0}
.hero p{font-size:13px;color:#e0e5ff}
.progress{height:9px;background:#ffffff30;border-radius:20px;margin-top:17px;overflow:hidden}
.progress i{display:block;height:100%;background:#6df0c1;border-radius:20px;width:0;transition:.3s}
.section-title{font-size:18px;font-weight:800;margin:25px 0 13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid #ffffff0d;padding:15px 10px;border-radius:17px;text-align:center}
.stat strong{display:block;font-size:22px;color:#a9baff}
.stat span{font-size:11px;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.subject{background:var(--panel);border:1px solid #ffffff10;border-radius:19px;padding:16px;text-align:left;color:var(--text);transition:.2s}
.subject:active{transform:scale(.97)}
.subject .emoji{font-size:28px;margin-bottom:10px}
.subject strong{display:block;font-size:15px}
.subject small{color:var(--muted);font-size:11px}
.card{background:var(--panel);padding:18px;border-radius:20px;margin-top:14px;border:1px solid #ffffff0d}
.btn{background:linear-gradient(110deg,var(--blue),var(--purple));color:white;padding:13px 18px;border-radius:14px;font-weight:800;width:100%;margin-top:12px}
.btn.secondary{background:var(--panel2);border:1px solid #ffffff18}
.btn.green{background:linear-gradient(110deg,#1baf85,#42d6a0);color:#061b17}
input{width:100%;background:#0e162c;border:1px solid #344265;color:white;padding:14px;border-radius:13px;margin-top:8px;outline:none}
input:focus{border-color:var(--blue)}
label{font-size:13px;color:var(--muted);display:block;margin-top:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:#11182cF2;backdrop-filter:blur(15px);border-top:1px solid #ffffff12;display:flex;justify-content:center;z-index:5}
.navinner{max-width:760px;width:100%;display:flex;justify-content:space-around;padding:10px 5px calc(10px + env(safe-area-inset-bottom))}
.navitem{background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:62px}
.navitem b{font-size:20px}
.navitem.active{color:#9cb2ff}
.page{animation:appear .25s ease}
@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.back{background:var(--panel2);color:white;padding:9px 14px;border-radius:11px;margin-bottom:17px}
.lesson{padding:15px;background:var(--panel);border-radius:15px;margin:12px 0;line-height:1.6}
.lesson h3{margin-bottom:7px}
.lesson p{color:#c1cbe1;font-size:14px}
.note{background:#202e50;border-left:3px solid var(--blue);padding:12px;border-radius:9px;margin-top:12px;font-size:13px}
.answer{display:block;width:100%;text-align:left;padding:14px;background:var(--panel2);border:1px solid #ffffff12;color:white;border-radius:13px;margin-top:10px}
.answer.selected{border-color:var(--blue);background:#263c72}
.answer.correct{border-color:var(--green);background:#164b3d}
.answer.wrong{border-color:#ff7777;background:#542c3c}
.feedback{margin-top:13px;font-size:14px;line-height:1.5}
.badge{display:inline-block;background:#26375e;color:#c4d2ff;padding:7px 11px;border-radius:20px;font-size:12px;margin:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted);font-size:13px}
.bigscore{font-size:38px;font-weight:900;color:#9eb5ff}
.rankrow{display:flex;align-items:center;gap:12px;padding:13px;background:var(--panel);border-radius:14px;margin-top:9px}
.ranknum{font-size:20px;width:30px;text-align:center}
.rankavatar{width:38px;height:38px;border-radius:13px;background:#304777;display:grid;place-items:center}
footer{text-align:center;color:#64718f;font-size:11px;margin-top:35px}
.overlay{position:fixed;inset:0;background:#050816eF;z-index:10;display:grid;place-items:center;padding:20px}
.modal{width:100%;max-width:420px;background:#17213a;border:1px solid #ffffff20;border-radius:24px;padding:24px;max-height:90vh;overflow:auto}
.modal h2{font-size:24px;margin-bottom:8px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#26375e;color:white;padding:12px 18px;border-radius:12px;z-index:20;font-size:13px;box-shadow:0 8px 30px #0008;max-width:90%;text-align:center}
@media(min-width:600px){.subjects{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<header>
 <div class="logo">DAHO <span>CENTRE</span></div>

const defaultData=()=>({name:"",points:0,correct:0,tests:0,lessons:[],completedTests:[],joined:false,created:Date.now()});
let data;
try{data=JSON.parse(localStorage.getItem("dahoCentre_v2"))||defaultData()}catch(e){data=defaultData()}
function save(){localStorage.setItem("dahoCentre_v2",JSON.stringify(data))}
let page="home",activeSubject=null,quiz=null,quizIndex=0,quizAnswers=[],quizFinished=false,lessonIndex=0;
const main=document.getElementById("main");
const overlay=document.getElementById("overlay");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(s){let t=document.getElementById("toast");t.textContent=s;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2300)}
function level(){return Math.floor(data.points/100)+1}
function initials(){return (data.name||"D").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function updateNav(){document.querySelectorAll(".navitem").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function go(p){page=p;activeSubject=null;updateNav();render()}
document.querySelectorAll(".navitem").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
function render(){
 document.getElementById("topAvatar").textContent=initials();
 if(!data.joined){registration();return}
 updateNav();
 if(page==="home")home();
 if(page==="subjects")subjectsPage();
 if(page==="rating")ratingPage();
 if(page==="profile")profilePage();
}
function registration(){
 main.innerHTML=`<div class="page" style="padding-top:35px">
 <div style="font-size:60px;text-align:center">🚀</div>
 <div style="text-align:center;margin:18px 0 25px"><div class="logo" style="font-size:29px">DAHO <span>CENTRE</span></div><p class="sub">Bilim sari birinchi qadamingni tashla!</p></div>
 <div class="card"><h2>Ro‘yxatdan o‘tish</h2><p class="sub" style="margin-top:7px">Ismingni yoz va bilim olamiga kir!</p>
 <label>Ism va familiya</label><input id="regName" maxlength="40" placeholder="Masalan: Ali Valiyev" autocomplete="name">
 <button class="btn" onclick="register()">Boshlash →</button>
 <p class="muted" style="margin-top:12px">Ma’lumot faqat shu qurilmada saqlanadi. Parol yoki telefon raqami kerak emas.</p></div></div>`;
}
function register(){
 let n=document.getElementById("regName").value.trim();
 if(n.length<2){toast("Iltimos, ismingni yoz!");return}
 data.name=n;data.joined=true;save();render();toast("Xush kelibsan, "+n+"!");
}
function home(){
 let percent=Math.min(100,data.points%100);
 main.innerHTML=`<div class="page">
 <p class="hello">Xush kelibsan, ${esc(data.name)}! 👋</p><h1>Bugun nimani<br>o‘rganamiz?</h1>
 <p class="sub">Har kuni ozgina bilim — katta natija!</p>
 <div class="hero"><small>⭐ Sening darajang</small><h2>${level()}-daraja</h2><p>${data.points} ball • Keyingi darajagacha ${100-percent} ball</p><div class="progress"><i style="width:${percent}%"></i></div></div>
 <div class="stats">
 <div class="stat"><strong>${data.points}</strong><span>⭐ Ball</span></div>
 <div class="stat"><strong>${data.tests}</strong><span>📝 Testlar</span></div>
 <div class="stat"><strong>${data.correct}</strong><span>✅ To‘g‘ri javob</span></div>
 </div>
 <div class="section-title">📚 Fanlarni o‘rganish</div><div class="subjects">${subjects.slice(0,4).map(subjectCard).join("")}</div>
 <button class="btn secondary" onclick="go('subjects')">Barcha 8 ta fanni ko‘rish →</button>
 <div class="section-title">🏅 Yutuqlaring</div>${achievementHTML()}
 </div>`;
}
function subjectCard(s){
 let done=data.lessons.filter(x=>x.startsWith(s.id+":")).length;
 return `<button class="subject" onclick="openSubject('${s.id}')"><div class="emoji">${s.emoji}</div><strong>${s.name}</strong><small>${done}/${s.lessons.length} dars tugallangan</small></button>`;
}
function subjectsPage(){
 main.innerHTML=`<div class="page"><p class="hello">Bilimingni oshir</p><h1>Barcha fanlar 📚</h1><p class="sub">O‘zing istagan fanni tanla va darslarni boshlagin.</p><div class="subjects" style="margin-top:20px">${subjects.map(subjectCard).join("")}</div></div>`;
}
function openSubject(id){activeSubject=subjects.find(s=>s.id===id);if(!activeSubject)return;subjectPage()}
function subjectPage(){
 let s=activeSubject,done=data.lessons.filter(x=>x.startsWith(s.id+":")).length;
 main.innerHTML=`<div class="page"><button class="back" onclick="go('subjects')">← Orqaga</button>
 <div style="font-size:45px">${s.emoji}</div><h1>${s.name}</h1><p class="sub">${s.desc}</p>
 <div class="card"><div class="row"><strong>Darslar bajarilishi</strong><strong>${done}/${s.lessons.length}</strong></div><div class="progress"><i style="width:${done/s.lessons.length*100}%"></i></div></div>
 <div class="section-title">📖 Darslar</div>
 ${s.lessons.map((l,i)=>`<div class="lesson"><div class="row"><h3>${i+1}. ${l[0]}</h3>${data.lessons.includes(s.id+":"+i)?'<span>✅</span>':''}</div><p>${l[1]}</p><div class="note">💡 ${l[2]}</div><button class="btn ${data.lessons.includes(s.id+":"+i)?"secondary":"green"}" onclick="completeLesson('${s.id}',${i})">${data.lessons.includes(s.id+":"+i)?"Tugallangan ✓":"+5 ball — Darsni tugatish"}</button></div>`).join("")}
 <div class="section-title">🧠 Bilimingni sinab ko‘r</div><div class="card"><p class="sub">Har bir testda 5 ta savol bor. Har bir to‘g‘ri javob uchun 10 ball olasan.</p><button class="btn" onclick="startQuiz('${s.id}')">Testni boshlash →</button></div>
 </div>`;
}
function completeLesson(id,i){
 let key=id+":"+i;if(data.lessons.includes(key)){toast("Bu dars allaqachon tugallangan!");return}
 data.lessons.push(key);data.points+=5;save();subjectPage();toast("+5 ball! Ajoyib!");
}
function startQuiz(id){
 activeSubject=subjects.find(s=>s.id===id);
 quiz=[...activeSubject.questions].sort(()=>Math.random()-.5).slice(0,5);
 quizIndex=0;quizAnswers=[];quizFinished=false;showQuestion();
}
function showQuestion(){
 if(quizIndex>=quiz.length){finishQuiz();return}
 let q=quiz[quizIndex];
 main.innerHTML=`<div class="page"><button class="back" onclick="subjectPage()">← Darsga qaytish</button>
 <div class="row"><span class="badge">${activeSubject.name}</span><span class="muted">${quizIndex+1}/${quiz.length}</span></div>
 <div class="progress"><i style="width:${(quizIndex+1)/quiz.length*100}%"></i></div>
 <div class="card" style="margin-top:22px"><p class="muted">SAVOL ${quizIndex+1}</p><h2 style="font-size:21px;margin-top:12px">${q[0]}</h2>
 ${q[1].map((a,i)=>`<button class="answer" onclick="chooseAnswer(${i})">${String.fromCharCode(65+i)}. ${a}</button>`).join("")}
 <div id="feedback" class="feedback"></div><button id="nextQuestion" class="btn hidden" onclick="nextQuestion()">Keyingi savol →</button></div></div>`;
}
function chooseAnswer(i){
 if(quizAnswers[quizIndex]!==undefined)return;
 let q=quiz[quizIndex];quizAnswers[quizIndex]=i;
 document.querySelectorAll(".answer").forEach((b,j)=>{
  if(j===q[2])b.classList.add("correct");
  else if(j===i)b.classList.add("wrong");
 });
 let correct=i===q[2];
 document.getElementById("feedback").innerHTML=`<strong>${correct?"✅ To‘g‘ri!":"❌ Xato!"}</strong><br>${q[3]}`;
 document.getElementById("nextQuestion").classList.remove("hidden");
}
function nextQuestion(){quizIndex++;showQuestion()}
function finishQuiz(){
 let score=quiz.reduce((n,q,i)=>n+(quizAnswers[i]===q[2]?1:0),0);
 data.tests++;data.correct+=score;data.points+=score*10;
 data.completedTests.push({subject:activeSubject.id,score:score,total:5,date:Date.now()});
 save();
 main.innerHTML=`<div class="page" style="text-align:center;padding-top:35px"><div style="font-size:65px">🏆</div><h1>Test yakunlandi!</h1><p class="sub">Natijang bilan tanish</p>
 <div class="card"><div class="bigscore">${score*20}%</div><p>${score} ta to‘g‘ri javob / 5 ta savol</p><div class="badge">+${score*10} ball</div><div class="progress"><i style="width:${score*20}%"></i></div></div>
 <button class="btn" onclick="subjectPage()">Darsga qaytish</button><button class="btn secondary" onclick="startQuiz('${activeSubject.id}')">Yana test ishlash</button><button class="btn secondary" onclick="go('home')">Asosiy sahifa</button></div>`;
}
function achievementHTML(){
 let a=[
 ["🌱","Birinchi qadam",data.lessons.length>=1,"Birinchi darsni tugat"],
 ["📖","Bilimdon",data.lessons.length>=5,"5 ta darsni tugat"],
 ["🧠","Sinovchi",data.tests>=1,"Birinchi testni ishlа"],
 ["⭐","Yulduz",data.points>=100,"100 ball yig‘"],
 ["🏆","Chempion",data.points>=500,"500 ball yig‘"],
 ["🔥","Faol o‘quvchi",data.tests>=5,"5 ta testni ishlа"]
 ];
 return `<div class="card">${a.map(x=>`<div class="row" style="padding:9px 0;opacity:${x[2]?1:.45}"><span>${x[0]} ${x[1]}<div class="muted">${x[3]}</div></span><strong>${x[2]?"✅":"🔒"}</strong></div>`).join("")}</div>`;
}
function ratingPage(){
 main.innerHTML=`<div class="page"><p class="hello">Natijalaringni kuzat</p><h1>🏆 Reyting</h1><p class="sub">Bu qurilmadagi o‘quvchilar reytingi.</p>
 <div class="card"><div class="bigscore">${data.points}</div><p class="muted">Sening ballaring</p><div class="badge">${level()}-daraja</div></div>
 <div class="section-title">Sening natijang</div><div class="rankrow"><div class="ranknum">⭐</div><div class="rankavatar">${initials()}</div><div style="flex:1"><strong>${esc(data.name)} (Sen)</strong><div class="muted">${level()}-daraja</div></div><strong>${data.points}</strong></div>
 <div class="card"><p class="muted">Eslatma: bu reyting faqat ushbu telefonda saqlanadigan natijalarni ko‘rsatadi. Haqiqiy umumiy onlayn reyting uchun server kerak bo‘ladi.</p></div></div>`;
}
function profilePage(){
 main.innerHTML=`<div class="page"><p class="hello">Shaxsiy sahifang</p><h1>Profil 👤</h1>
 <div class="card" style="text-align:center;padding:25px"><div class="avatar" style="width:75px;height:75px;margin:auto;font-size:26px">${initials()}</div><h2 style="margin-top:13px">${esc(data.name)}</h2><p class="muted">${level()}-daraja o‘quvchisi</p><div class="bigscore">${data.points}</div><p class="muted">Jami ball</p><button class="btn secondary" onclick="editName()">Ismni o‘zgartirish</button></div>
 <div class="section-title">📊 Statistikam</div><div class="stats">
 <div class="stat"><strong>${data.tests}</strong><span>Testlar</span></div>
 <div class="stat"><strong>${data.correct}</strong><span>To‘g‘ri javob</span></div>
 <div class="stat"><strong>${data.lessons.length}</strong><span>Darslar</span></div></div>
 <div class="section-title">🏅 Yutuqlar</div>${achievementHTML()}
 <div class="section-title">⚙️ Sozlamalar</div><div class="card"><button class="btn secondary" onclick="editName()">Ismni o‘zgartirish</button><button class="btn secondary" onclick="exportData()">Natijalarni zaxiralash</button><button class="btn secondary" onclick="resetProgress()">Barcha natijalarni qayta boshlash</button></div></div>`;
}
function editName(){
 let n=prompt("Ism va familiyangni yoz:",data.name);
 if(n&&n.trim().length>=2){data.name=n.trim().slice(0,40);save();render();toast("Profil yangilandi!")}
}
function exportData(){
 let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 let url=URL.createObjectURL(blob),a=document.createElement("a");
 a.href=url;a.download="daho-centre-natijalar.json";a.click();URL.revokeObjectURL(url);
 toast("Zaxira fayli tayyor!");
}
function resetProgress(){
 if(!confirm("Barcha ballar, testlar va darslar o‘chiriladi. Davom etamizmi?"))return;
 let name=data.name;data=defaultData();data.name=name;data.joined=true;save();render();toast("Natijalar qayta boshlandi.");
}
render();
</script>
